<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JIAICB-(Project Version)</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
    padding: 0;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    border-bottom: 1px solid #333;
    white-space: pre-wrap;
  }
  .msg {
    margin: 5px 0;
  }
  .user {
    color: #6cf;
  }
  .ai {
    color: #9f9;
  }
  #controls {
    display: flex;
    flex-direction: column;
    padding: 10px;
    background: #222;
  }
  #input {
    resize: none;
    width: 100%;
    height: 60px;
    padding: 8px;
    background: #000;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    font-family: monospace;
  }
  .buttons {
    margin-top: 8px;
    display: flex;
    justify-content: flex-end;
  }
  button {
    margin-left: 10px;
    background: #333;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover {
    background: #555;
  }
</style>
</head>
<body>
  <div id="chat"></div>

  <div id="controls">
    <textarea id="input" placeholder="Type a message... (Shift+Enter for newline)"></textarea>
    <div class="buttons">
      <button onclick="sendMessage()">Send</button>
      <button onclick="clearMemory()">Clear Memory</button>
    </div>
  </div>

<script>
const chatBox = document.getElementById('chat');
const inputBox = document.getElementById('input');
const deviceId = localStorage.getItem("device_id") || ("dev_" + Math.random().toString(36).slice(2));
localStorage.setItem("device_id", deviceId);

function addMessage(sender, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (sender === 'You' ? 'user' : 'ai');
  div.innerHTML = `<b>${sender}:</b> ${text}`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text) return;
  addMessage('You', text);
  inputBox.value = '';
  inputBox.focus();

  try {
    const res = await fetch('/api', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ input: text, device: deviceId })
    });
    const reply = await res.text();
    addMessage('AI', reply);
  } catch (err) {
    addMessage('AI', 'Error: ' + err.message);
  }
}

async function clearMemory() {
  try {
    const res = await fetch(`/api?clear=true&device=${deviceId}`);
    const text = await res.text();
    chatBox.innerHTML = '';
    addMessage('System', text);
  } catch (err) {
    addMessage('System', 'Error clearing memory: ' + err.message);
  }
}

inputBox.addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    if (event.shiftKey) {
      // Allow newline
      return;
    } else {
      event.preventDefault();
      sendMessage();
    }
  }
});
</script>
</body>
</html>
